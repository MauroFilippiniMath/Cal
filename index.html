<!DOCTYPE html>
<html lang="it">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>RunCalc Advanced</title>
    <style>
        :root {
            --primary: #FF5722;
            --accent: #03DAC6;
            --bg: #121212;
            --card: #1E1E1E;
            --text: #FFFFFF;
            --text-muted: #B0B0B0;
        }
        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
            background-color: var(--bg);
            color: var(--text);
            margin: 0;
            padding: 20px;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
        }
        .card {
            background-color: var(--card);
            padding: 30px;
            border-radius: 20px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.5);
            width: 100%;
            max-width: 450px;
        }
        h1 {
            text-align: center;
            margin-top: 0;
            color: var(--primary);
            margin-bottom: 25px;
        }
        .grid-2 {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 15px;
        }
        .input-group {
            margin-bottom: 15px;
        }
        label {
            display: block;
            margin-bottom: 5px;
            font-size: 13px;
            color: var(--text-muted);
        }
        input {
            width: 100%;
            padding: 12px;
            border: none;
            border-radius: 10px;
            background-color: #2C2C2C;
            color: white;
            font-size: 16px;
            box-sizing: border-box;
        }
        input:focus {
            outline: 2px solid var(--primary);
        }
        button {
            width: 100%;
            padding: 15px;
            background-color: var(--primary);
            color: white;
            border: none;
            border-radius: 10px;
            font-size: 18px;
            font-weight: bold;
            cursor: pointer;
            margin-top: 15px;
            transition: background-color 0.2s;
        }
        button:active {
            background-color: #E64A19;
        }
        .result-box {
            margin-top: 25px;
            padding: 20px;
            background-color: #2C2C2C;
            border-radius: 10px;
            display: none;
        }
        .stat {
            display: flex;
            justify-content: space-between;
            margin-bottom: 12px;
            font-size: 16px;
            padding-bottom: 8px;
            border-bottom: 1px solid #333;
        }
        .stat:last-child {
            margin-bottom: 0;
            padding-bottom: 0;
            border-bottom: none;
        }
        .stat strong {
            color: var(--primary);
        }
        .stat.highlight strong {
            color: var(--accent);
        }
    </style>
</head>
<body>

    <div class="card">
        <h1>RunCalc Pro</h1>
        
        <div class="grid-2">
            <div class="input-group">
                <label for="peso">Peso (kg)</label>
                <input type="number" id="peso" placeholder="es. 70" step="0.1">
            </div>
            <div class="input-group">
                <label for="eta">Età (anni)</label>
                <input type="number" id="eta" placeholder="es. 18">
            </div>
        </div>

        <div class="grid-2">
            <div class="input-group">
                <label for="distanza">Distanza (km)</label>
                <input type="number" id="distanza" placeholder="es. 5" step="0.01">
            </div>
            <div class="input-group">
                <label for="tempo">Tempo (minuti)</label>
                <input type="number" id="tempo" placeholder="es. 30" step="1">
            </div>
        </div>

        <div class="grid-2">
            <div class="input-group">
                <label for="d_pos">Dislivello + (metri)</label>
                <input type="number" id="d_pos" placeholder="es. 150" value="0">
            </div>
            <div class="input-group">
                <label for="d_neg">Dislivello - (metri)</label>
                <input type="number" id="d_neg" placeholder="es. 150" value="0">
            </div>
        </div>

        <div class="input-group">
            <label for="note">Note (es. percorso, audiolibro, sensazioni)</label>
            <input type="text" id="note" placeholder="Opzionale">
        </div>
        
        <button onclick="calcolaPrestazione()">Calcola Statistiche</button>

        <div class="result-box" id="risultato">
            <div class="stat highlight">
                <span>Passo reale:</span>
                <strong id="out-passo-reale">0'00"/km</strong>
            </div>
            <div class="stat">
                <span>Passo eq. in pianura:</span>
                <strong id="out-passo-eq">0'00"/km</strong>
            </div>
            <div class="stat highlight">
                <span>Calorie totali:</span>
                <strong id="out-calorie">0 kcal</strong>
            </div>
            <div class="stat">
                <span>Distanza eq. in pianura:</span>
                <strong id="out-distanza-eq">0 km</strong>
            </div>
        </div>
    </div>

    <script>
        function formattaPasso(minutiDecimali) {
            const minuti = Math.floor(minutiDecimali);
            const secondi = Math.floor((minutiDecimali - minuti) * 60);
            const secFormattati = secondi < 10 ? '0' + secondi : secondi;
            return `${minuti}'${secFormattati}"/km`;
        }

        function calcolaPrestazione() {
            const peso = parseFloat(document.getElementById('peso').value);
            const distanza = parseFloat(document.getElementById('distanza').value);
            const tempo = parseFloat(document.getElementById('tempo').value);
            const dPos = parseFloat(document.getElementById('d_pos').value) || 0;
            const dNeg = parseFloat(document.getElementById('d_neg').value) || 0;

            if (!peso || !distanza || !tempo) {
                alert("Compila almeno Peso, Distanza e Tempo per procedere.");
                return;
            }

            // Calcolo Distanza Equivalente in Pianura (circa 1km extra ogni 100m di D+)
            const distanzaEquivalente = distanza + (dPos / 100);

            // Calcolo Calorie (formula affinata per il dislivello)
            // Base: 1.036 kcal/kg/km. Salita aggiunge fatica, discesa la riduce poco.
            let calorieBase = peso * distanza * 1.036;
            let calorieSalita = (dPos * peso) * 0.005; 
            let calorieDiscesa = (dNeg * peso) * 0.001;
            let calorieTotali = calorieBase + calorieSalita - calorieDiscesa;

            // Calcolo Passi
            const passoReale = tempo / distanza;
            const passoEquivalente = tempo / distanzaEquivalente;

            // Aggiornamento interfaccia
            document.getElementById('out-passo-reale').innerText = formattaPasso(passoReale);
            document.getElementById('out-passo-eq').innerText = formattaPasso(passoEquivalente);
            document.getElementById('out-calorie').innerText = Math.round(calorieTotali) + ' kcal';
            document.getElementById('out-distanza-eq').innerText = distanzaEquivalente.toFixed(2) + ' km';
            
            document.getElementById('risultato').style.display = 'block';
        }
    </script>
</body>
</html>
